plugins {
    id 'com.android.application'
}

android {
    namespace "com.mylifeos.app"
    compileSdk 36
    aaptOptions {
        noCompress "tflite"
        noCompress "lite"
    }
    defaultConfig {
        applicationId "com.mylifeosv2.app"
        minSdk 24
        targetSdk 35
        // Hardcoded release version — CI overrides are intentionally ignored
        versionCode 3473499
        versionName "1.0.21"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty('MYLIFEOS_STORE_FILE') ?: 'mylifeos-release-v2.keystore')
            storePassword project.findProperty('MYLIFEOS_STORE_PASSWORD') ?: 'lifeos123456'
            keyAlias project.findProperty('MYLIFEOS_KEY_ALIAS') ?: 'mylifeos-v2'
            keyPassword project.findProperty('MYLIFEOS_KEY_PASSWORD') ?: 'lifeos123456'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Sign debug builds with the same release keystore so CI-produced
            // debug APKs have a stable signature across runs (otherwise every
            // GitHub Actions run generates a new ephemeral debug.keystore and
            // the resulting APK cannot install over any previous install).
            signingConfig signingConfigs.release
        }
    }
}

// Never allow a release task to silently emit an unsigned APK.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path.contains('Release') && it.name.startsWith('assemble') }) {
        def keystore = android.signingConfigs.release.storeFile
        if (keystore == null || !keystore.exists() || keystore.length() < 100) {
            throw new GradleException("Release keystore missing/corrupt: ${keystore}")
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-haptics')
    implementation project(':capacitor-keyboard')
    implementation project(':capacitor-status-bar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.work:work-runtime:2.10.3'
    // TensorFlow Lite — GPU acceleration only (NNAPI removed - not available in 2.14.0)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'
    // CameraX
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // ML Kit (free, no API key required)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // Local JVM unit tests (ContentMatcher normalization / word-boundary rules).
    // Robolectric is required because ContentMatcher touches android.text.TextUtils.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}

apply from: 'capacitor.build.gradle'
